    <script>
      (function () {
        try {
          var theme = window.localStorage.getItem('ka-card-theme');
          var safeTheme = theme === 'light' || theme === 'dark' ? theme : 'dark';
          document.documentElement.classList.toggle('dark', safeTheme === 'dark');
          document.documentElement.dataset.theme = safeTheme;
        } catch (error) {
          document.documentElement.classList.add('dark');
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <style>
      #app-boot-loader {
        position: fixed;
        inset: 0;

        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 50% 45%, rgb(212 164 45 / 0.18), transparent 52%),
          radial-gradient(circle at 10% 0%, rgb(29 149 168 / 0.14), transparent 35%),
          linear-gradient(180deg, #071316 0%, #03080a 100%);
        transition: opacity 240ms ease, visibility 240ms ease;
      }

      #app-boot-loader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .boot-loader__logo {
        width: clamp(104px, 22vw, 158px);
        height: clamp(104px, 22vw, 158px);
        object-fit: contain;
        animation: boot-logo-motion 1.15s cubic-bezier(0.16, 1, 0.3, 1) both;
        filter: drop-shadow(0 14px 28px rgb(35 195 233 / 0.35)) drop-shadow(0 0 22px rgb(224 177 59 / 0.28));
      }

      @keyframes boot-logo-motion {
        0% {
          transform: translateY(34px) scale(0.82);
          opacity: 0;
        }

        50% {
          transform: translateY(-5px) scale(1.035);
          opacity: 1;
        }

        100% {
          transform: translateY(0) scale(1);
          opacity: 1;
        }
      }
